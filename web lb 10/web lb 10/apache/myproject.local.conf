<VirtualHost *:80>
    ServerName myproject.local
    DocumentRoot /var/www/MCA108P-AS10/project/public
    Redirect permanent / https://myproject.local/
    ErrorLog ${APACHE_LOG_DIR}/myproject_error.log
    CustomLog ${APACHE_LOG_DIR}/myproject_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName myproject.local
    DocumentRoot /var/www/MCA108P-AS10/project/public

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/myproject.local.crt
    SSLCertificateKeyFile /etc/ssl/private/myproject.local.key

    <Directory /var/www/MCA108P-AS10/project/public>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/myproject_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/myproject_ssl_access.log combined
</VirtualHost>
